# train.yml

mode: "train"
project_name: "pooling-loss"
group_name: "train-poolingloss-512-msmarco-infonce"

data:
  ds_name: "msmarco" # allnli, msmarco, booksum, all
  batch_size: 32
  tokenizer_name: "FacebookAI/roberta-base"
  max_length: 512
  padding: "max_length" # max_length, false
  map_batch_size: 1000
  load_from_cache_file: true
  shuffle: true # Set to false to get "curriculum learning" on unified data

model:
  base_model_name: "FacebookAI/roberta-base"
  disable_pe: false
  freeze_pe: false
  is_decoder_model: false
  pooling_method: "li" # mean, li, average_li, mean_li

train:
  loss: "info-nce" # info-nce, triplet, pairwise-ce
  tau: 0.07 # Only for CE losses
  margin: null # Only for triplet loss
  # --- optimizer ---
  lr: 2.0e-5
  weight_decay: 0.01
  # --- checkpointing ---
  checkpoint_metric: "val_mrr"
  checkpoint_mode: "max"
  save_top_k: 1
  # --- trainer ---
  gather: true
  device: "gpu"
  num_devices: 3
  strategy: "ddp_find_unused_parameters_true"
  process_group_backend: "gloo"
  max_steps: -1
  max_epochs: 1
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  gradient_clip_val: null
  precision: "16-mixed" # 16-mixed, 32
  overfit_batches: 0.0
  # --- wandb ---
  use_wandb: true
  log_model: false
  watch: null # parameters, gradients, all, null
